<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Omar & Mariam · Katb Ketab · عقد قران عمر ومريم">
<meta property="og:description" content="Friday, 25 December 2026 · Al Shorta Mosque, New Cairo">
<meta property="og:image" content="envelope-1.jpg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Omar's Katb Ketab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Marcellus&display=swap">
<style>
/* Layout: three painted envelope frames crossfade into the painted invitation; the tile-frame countdown follows. Single-theme by design. */
:root{
  --ink:#3d3a24; --ink-soft:#6b6545; --rose:#a4533f; --paper:#f3ead8; --ground:#f6f0e4; --gold:#b8955a;
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --label:"Marcellus","Trajan Pro",Georgia,serif;
  --arabic:"Amiri","Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  /* text box inside each painting, as % of the image */
  --inv-top:34%; --inv-h:38.5%; --inv-w:54%; --inv-x:50.5%;
  --cd-top:22%; --cd-h:55.6%; --cd-w:42%;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--display);overflow-x:hidden;margin:0}
body.locked{overflow:hidden;height:100%}
main{display:flex;flex-direction:column;align-items:center;gap:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.panel{position:relative;width:min(100%,480px);aspect-ratio:1536/2752;max-width:100%;background:center/cover no-repeat;container-type:inline-size}
.invite{background-image:url("invite-bg.jpg")}
.countdown{background-image:url("countdown-frame.jpg")}
.box{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.25cqw}
.invite .box{top:var(--inv-top);height:var(--inv-h);width:var(--inv-w);left:var(--inv-x)}
.countdown .box{top:var(--cd-top);height:var(--cd-h);width:var(--cd-w)}
.label{font-family:var(--label);font-size:2.4cqw;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);line-height:1.8}
.basmala{max-width:80%;font-style:italic;font-size:3.1cqw;color:var(--ink-soft);text-wrap:balance;line-height:1.3}
.names{display:flex;flex-direction:column;align-items:center}
.names .n{font-size:9.6cqw;line-height:1}
.names .amp{font-style:italic;font-size:5.5cqw;color:var(--rose);line-height:1.2}
.date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.date .side{font-family:var(--label);font-size:2.4cqw;letter-spacing:.25em;text-transform:uppercase;color:var(--ink-soft)}
.date .side:first-child{text-align:end}.date .side:last-child{text-align:start}
.date .day{font-size:9.6cqw;line-height:1;border-inline:1px solid color-mix(in srgb,var(--gold) 60%,transparent);padding:0 14px}
.time{font-size:3.8cqw;font-style:italic}
.venue{font-size:5.4cqw;line-height:1.1}
.map{font-family:var(--label);font-size:2.3cqw;letter-spacing:.25em;text-transform:uppercase;color:var(--paper);background:var(--rose);text-decoration:none;padding:9px 16px;border-radius:999px}
.ph{border-bottom:1px dashed color-mix(in srgb,var(--rose) 55%,transparent)}
.countdown h2{margin:0;font-weight:400;font-size:6.6cqw;line-height:1}
.unit{display:flex;flex-direction:column;align-items:center}
.unit b{font-weight:400;font-style:italic;font-size:6.2cqw;line-height:1;font-variant-numeric:tabular-nums}
.unit.big b{font-size:12cqw}
.unit span{font-size:2.9cqw;color:var(--ink-soft)}
.verse{font-style:italic;font-size:3cqw;line-height:1.45;color:var(--ink-soft);margin:0}
.verse cite{display:block;font-style:normal;font-family:var(--label);font-size:9px;letter-spacing:.28em;margin-top:4px;color:var(--rose)}

/* Opening: two painted video clips, aligned exactly over the invitation panel */
.cover{position:fixed;inset:0;z-index:5;background:var(--ground);cursor:pointer;transition:opacity .9s ease,visibility 0s linear .9s}
.frames{position:absolute;left:50%;transform:translateX(-50%);top:env(safe-area-inset-top,0px);width:min(100%,480px);aspect-ratio:1536/2752;overflow:hidden}
.frames img,.frames video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frames .clip{opacity:0}
.frames .clip.on{opacity:1}
#still2{opacity:0;transition:opacity 1.6s ease}
body.fallback #still2{opacity:1}
.hint{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--label);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 8px rgba(246,240,228,.9);animation:pulse 2.4s ease-in-out infinite;transition:opacity .4s}
@keyframes pulse{50%{opacity:.45}}
body.opening .hint{opacity:0;animation:none}
body.opened .cover{opacity:0;visibility:hidden;pointer-events:none}
body.opened .invite .box>*{animation:rise 1.1s ease both;animation-delay:calc(var(--i,0)*120ms + .3s)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sound{position:fixed;z-index:6;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--paper) 85%,transparent);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.sound:focus-visible,.cover:focus-visible,.map:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* Language switch */
.lang{position:fixed;z-index:7;top:calc(12px + env(safe-area-inset-top,0px));right:max(calc(12px + env(safe-area-inset-right,0px)),calc(50% - 240px + 12px));display:flex;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);backdrop-filter:blur(6px)}
.lang button{border:0;background:none;color:var(--ink-soft);font-family:var(--label);font-size:11px;letter-spacing:.12em;padding:6px 12px;border-radius:999px;cursor:pointer;line-height:1}
.lang button[data-l="ar"]{font-family:var(--arabic);font-size:14px;letter-spacing:0;padding:4px 12px 6px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* Arabic typography: no tracking, no caps, no faux italics */
html[lang="ar"] body{font-family:var(--arabic)}
html[lang="ar"] .label,html[lang="ar"] .date .side,html[lang="ar"] .map,html[lang="ar"] .hint{font-family:var(--arabic);letter-spacing:0!important;text-transform:none}
html[lang="ar"] .label{font-size:3.2cqw;line-height:1.55}
html[lang="ar"] .date .side{font-size:3.6cqw}
html[lang="ar"] .basmala{max-width:100%;white-space:nowrap;font-style:normal;font-size:4.2cqw;font-weight:700;color:var(--ink)}
html[lang="ar"] .names .n{font-size:9.4cqw;line-height:1.05;font-weight:700}
html[lang="ar"] .names .amp{font-style:normal;font-size:5.2cqw;line-height:.9}
html[lang="ar"] .time,html[lang="ar"] .unit b{font-style:normal}
html[lang="ar"] .time{font-size:3.9cqw}
html[lang="ar"] .date .day{font-size:8.6cqw}
html[lang="ar"] .venue{font-size:5.4cqw;font-weight:700}
html[lang="ar"] .countdown h2{font-size:7.4cqw;font-weight:700}
html[lang="ar"] .unit span{font-size:3.4cqw}
html[lang="ar"] .map{font-size:3.4cqw;padding:7px 18px 9px}
html[lang="ar"] .hint{font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>

</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-l="en" aria-pressed="true">EN</button>
  <button type="button" data-l="ar" aria-pressed="false" lang="ar">عربي</button>
</div>

<div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="frames">
    <img id="still1" src="envelope-1.jpg" alt="">
    <img id="still2" src="invite-bg.jpg" alt="">
    <video class="clip" id="clip1" src="opening.mp4" poster="envelope-1.jpg" muted playsinline preload="auto"></video>
  </div>
  <div class="hint" data-t="hint">Tap to open</div>
</div>

<main>
  <section class="panel invite" aria-label="Invitation">
    <div class="box">
      <div class="basmala" style="--i:0" data-t="basmala">In the name of God, the Most Gracious, the Most Merciful</div>
      <div class="names" style="--i:1"><span class="n" data-t="groom">Omar</span><span class="amp" data-t="and">&amp;</span><span class="n" data-t="bride">Mariam</span></div>
      <div class="label" style="--i:2" data-t="invite">Invite you to witness<br>their Katb Ketab</div>
      <div class="date" style="--i:3"><span class="side" data-t="month">December</span><span class="day" data-t="day">25</span><span class="side" data-t="year">2026</span></div>
      <div class="time" style="--i:4" data-t="time">Friday · 2:00 PM</div>
      <div style="--i:5;display:flex;flex-direction:column;gap:.6cqw;align-items:center">
        <div class="venue" data-t="venue">Al Shorta Mosque</div>
        <div class="label" style="letter-spacing:.16em" data-t="area">Fifth Settlement, New Cairo</div>
      </div>
    </div>
  </section>
  <section class="panel countdown" aria-label="Countdown">
    <div class="box">
      <h2 data-t="countdown">Countdown</h2>
      <div class="label" style="letter-spacing:.18em" data-t="until">Until 25 Dec 2026</div>
      <div class="unit big"><b id="cd-d">–</b><span data-t="days">Days</span></div>
      <div style="display:flex;gap:4.5cqw;justify-content:center">
        <div class="unit"><b id="cd-h">–</b><span data-t="hours">Hours</span></div>
        <div class="unit"><b id="cd-m">–</b><span data-t="minutes">Minutes</span></div>
        <div class="unit"><b id="cd-s">–</b><span data-t="seconds">Seconds</span></div>
      </div>
      <a class="map" href="https://www.google.com/maps/search/?api=1&query=%D9%85%D8%B3%D8%AC%D8%AF+%D8%A7%D9%84%D8%B4%D8%B1%D8%B7%D8%A9+%D8%A7%D9%84%D8%AA%D8%AC%D9%85%D8%B9+%D8%A7%D9%84%D8%AE%D8%A7%D9%85%D8%B3" target="_blank" rel="noopener" data-t="map">View on map</a>
    </div>
  </section>
</main>

<button class="sound" id="sound" aria-label="Mute music" hidden>
  <svg id="ico-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg id="ico-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<audio id="music" src="piano.mp3" loop preload="auto"></audio>

<script>
(function(){
  var target=new Date("2026-12-25T14:00:00+02:00"); /* 2:00 PM Cairo */
  var T={
    en:{hint:"Tap to open",basmala:"In the name of God, the Most Gracious, the Most Merciful",groom:"Omar",and:"&",bride:"Mariam",
      invite:"Invite you to witness<br>their Katb Ketab",month:"December",day:"25",year:"2026",time:"Friday · 2:00 PM",
      venue:"Al Shorta Mosque",area:"Fifth Settlement, New Cairo",countdown:"Countdown",until:"Until 25 Dec 2026",
      days:"Days",hours:"Hours",minutes:"Minutes",seconds:"Seconds",map:"View on map"},
    ar:{hint:"اضغط لفتح الدعوة",basmala:"بسم الله الرحمن الرحيم",groom:"عمر",and:"و",bride:"مريم",
      invite:"يتشرفان بدعوتكم لحضور عقد قرانهما",month:"ديسمبر",day:"٢٥",year:"٢٠٢٦",time:"الجمعة · الساعة ٢ ظهرًا",
      venue:"مسجد الشرطة",area:"التجمع الخامس، القاهرة الجديدة",countdown:"العد التنازلي",until:"حتى ٢٥ ديسمبر ٢٠٢٦",
      days:"يوم",hours:"ساعة",minutes:"دقيقة",seconds:"ثانية",map:"عرض الموقع"}};
  var lang="en";
  function digits(x){return lang==="ar"?String(x).replace(/[0-9]/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]}):String(x)}
  var pad=function(n){return String(n).padStart(2,"0")};
  function tick(){var s=Math.max(0,Math.floor((target-new Date())/1000));
    document.getElementById("cd-d").textContent=digits(Math.floor(s/86400));
    document.getElementById("cd-h").textContent=digits(pad(Math.floor(s%86400/3600)));
    document.getElementById("cd-m").textContent=digits(pad(Math.floor(s%3600/60)));
    document.getElementById("cd-s").textContent=digits(pad(s%60))}
  function setLang(l){lang=l;var d=T[l],root=document.documentElement;
    root.lang=l;root.dir=l==="ar"?"rtl":"ltr";
    document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.getAttribute("data-t")];if(v!=null)el.innerHTML=v});
    document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===l?"true":"false")});
    tick();try{localStorage.setItem("lang",l)}catch(e){}}
  var saved=null;try{saved=localStorage.getItem("lang")}catch(e){}
  setLang(saved||(/^ar/i.test(navigator.language||"")?"ar":"en"));
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();setLang(b.getAttribute("data-l"))})});
  setInterval(tick,1000);

  var body=document.body,cover=document.getElementById("cover"),music=document.getElementById("music"),btn=document.getElementById("sound");
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  body.classList.add("locked");
  function fadeIn(a){a.volume=0;var v=0,t=setInterval(function(){v=Math.min(.7,v+.035);a.volume=v;if(v>=.7)clearInterval(t)},120)}
  function open(){
    if(body.classList.contains("opening"))return;body.classList.add("opening");
    try{var p=music.play();if(p&&p.then)p.then(function(){fadeIn(music);btn.hidden=false}).catch(function(){})}catch(e){}
    var c1=document.getElementById("clip1");
    function finish(delay){setTimeout(function(){body.classList.add("opened");body.classList.remove("locked");setTimeout(function(){cover.hidden=true},1000)},delay)}
    var fb=false;function fallback(){if(fb)return;fb=true;body.classList.add("fallback");finish(reduce?0:1700)}
    if(reduce||c1.error||c1.readyState===0&&c1.networkState===3){fallback();return}
    c1.addEventListener("ended",function(){finish(0)});
    c1.addEventListener("error",fallback);
    var p1=c1.play();
    if(p1&&p1.then)p1.then(function(){c1.classList.add("on")}).catch(fallback);else c1.classList.add("on");
  }
  cover.addEventListener("click",open);
  cover.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  btn.addEventListener("click",function(){music.muted=!music.muted;
    document.getElementById("ico-on").hidden=music.muted;document.getElementById("ico-off").hidden=!music.muted;
    btn.setAttribute("aria-label",music.muted?"Play music":"Mute music")});
})();
</script>

</body>
</html>
